name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            obsidian-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Deliberately does NOT install obsidian-plugin deps: linting with only
      # the root install (obsidian 1.8.7, no declarative settings API) matches
      # the community-review environment and keeps main.ts free of `any` under
      # both type resolutions. The plugin job still typechecks against 1.13.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore

  plugin:
    name: Typecheck and build plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            obsidian-plugin/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Install plugin dependencies
        run: npm ci
        working-directory: obsidian-plugin

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
